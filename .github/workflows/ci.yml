# Continuous integration: build and test on Windows with MSVC (with Qt, including
# the application tests pmm_app_tests), ASan, and clang-cl warnings and UBSan on the
# Qt-free libraries, a clang-format 22 check and the UI contrast check. Packages and
# releases are in release.yml, which also runs this workflow first.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

# In a called workflow github.workflow is the caller's name. The prefix keeps this
# group different from the caller's own group, which would deadlock.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  QT_VERSION: '6.10.3'
  AQT_VERSION: '==3.3.*'
  CLANG_FORMAT_VERSION: '22.1.8'
  # The pmm_app_tests test properties set this as well; it also covers test
  # discovery, which runs the test executable.
  QT_QPA_PLATFORM: offscreen

jobs:
  build-test:
    name: Build and test (Windows MSVC)
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      # Explicit compilers: Windows runners also carry a MinGW gcc on PATH,
      # which CMake's compiler search could otherwise pick before cl.
      CC: cl
      CXX: cl
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Ninja
        shell: pwsh
        run: |
          if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) { choco install ninja --no-progress -y }
          ninja --version

      - name: Install Qt ${{ env.QT_VERSION }}
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: win64_msvc2022_64
          aqtversion: ${{ env.AQT_VERSION }}
          cache: true

      - name: Configure
        run: cmake --preset ci

      - name: Build
        run: cmake --build --preset ci

      # The application tests must be part of every run.
      - name: Check that the application tests are registered
        shell: bash
        run: |
          count="$(ctest --preset ci -N -L pmm_app_tests | tr -d '\r' | sed -n 's/^Total Tests: *//p')"
          echo "pmm_app_tests: ${count:-0} tests"
          test "${count:-0}" -gt 0

      - name: Test
        run: ctest --preset ci --output-on-failure --output-junit ctest-junit.xml

      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-logs-windows-2025
          path: |
            build/ci/Testing/Temporary/
            build/ci/ctest-junit.xml
          if-no-files-found: ignore
          retention-days: 14

  core-sanitize:
    name: Sanitizers (Windows MSVC, ASan, Qt-free libraries)
    runs-on: windows-2025
    timeout-minutes: 45
    env:
      CC: cl
      CXX: cl
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Ninja
        shell: pwsh
        run: |
          if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) { choco install ninja --no-progress -y }
          ninja --version

      # Instrumented executables load the ASan runtime DLL from PATH. It ships next
      # to the compiler.
      - name: Put the ASan runtime on PATH
        shell: pwsh
        run: |
          $dir = Join-Path $env:VCToolsInstallDir 'bin\Hostx64\x64'
          if (-not (Test-Path (Join-Path $dir 'clang_rt.asan_dynamic-x86_64.dll'))) {
            throw "The ASan runtime is not in $dir."
          }
          $dir | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Configure
        run: cmake --preset core-sanitize

      - name: Build
        run: cmake --build --preset core-sanitize

      - name: Test
        run: ctest --preset core-sanitize --output-on-failure --output-junit ctest-junit.xml

      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-logs-core-sanitize
          path: |
            build/core-sanitize/Testing/Temporary/
            build/core-sanitize/ctest-junit.xml
          if-no-files-found: ignore
          retention-days: 14

  clang-cl:
    name: Warnings (Windows clang-cl, Qt-free libraries)
    runs-on: windows-2025
    timeout-minutes: 45
    env:
      CC: clang-cl
      CXX: clang-cl
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Ninja
        shell: pwsh
        run: |
          if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) { choco install ninja --no-progress -y }
          ninja --version

      # LLVM is on the windows-2025 image; choco is the fallback for an image without it.
      - name: Put LLVM on PATH
        shell: pwsh
        run: |
          $dir = 'C:\Program Files\LLVM\bin'
          if (-not (Test-Path (Join-Path $dir 'clang-cl.exe'))) { choco install llvm --no-progress -y }
          & (Join-Path $dir 'clang-cl.exe') --version
          $dir | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Configure
        run: cmake --preset core-clang-cl

      - name: Build
        run: cmake --build --preset core-clang-cl

      - name: Test
        run: ctest --preset core-clang-cl --output-on-failure --output-junit ctest-junit.xml

      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-logs-core-clang-cl
          path: |
            build/core-clang-cl/Testing/Temporary/
            build/core-clang-cl/ctest-junit.xml
          if-no-files-found: ignore
          retention-days: 14

  format-check:
    name: Format check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install clang-format ${{ env.CLANG_FORMAT_VERSION }}
        run: python -m pip install "clang-format==${CLANG_FORMAT_VERSION}"

      - name: Check formatting
        run: |
          clang-format --version
          # scripts/check-format.sh only warns about another major version.
          clang-format --version | grep 'version 22\.' > /dev/null || { echo "clang-format 22 expected" >&2; exit 1; }
          bash scripts/check-format.sh

      - name: Check UI colour contrast
        run: python ui/dev/check_contrast.py
