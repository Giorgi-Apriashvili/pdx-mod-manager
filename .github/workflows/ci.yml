# Continuous integration: build and test on Windows, Linux and macOS (with Qt,
# including the application tests pmm_app_tests), ASan + UBSan on the Qt-free
# libraries, a clang-format 22 check and the UI contrast check. Packages and
# releases are in release.yml, which also runs this workflow first.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

# In a called workflow github.workflow is the caller's name. The prefix keeps this
# group different from the caller's own group, which would deadlock.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  QT_VERSION: '6.10.3'
  AQT_VERSION: '==3.3.*'
  CLANG_FORMAT_VERSION: '22.1.8'
  # The pmm_app_tests test properties set this as well; it also covers test
  # discovery, which runs the test executable.
  QT_QPA_PLATFORM: offscreen

jobs:
  build-test:
    name: Build and test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows MSVC
            os: windows-2025
            qt-arch: win64_msvc2022_64
            cc: cl
            cxx: cl
          - name: Linux GCC
            os: ubuntu-24.04
            qt-arch: linux_gcc_64
            cc: gcc-13
            cxx: g++-13
          - name: macOS AppleClang
            os: macos-15
            qt-arch: clang_64
            cc: clang
            cxx: clang++
    env:
      # Explicit compilers: Windows runners also carry a MinGW gcc on PATH,
      # which CMake's compiler search could otherwise pick before cl.
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Ninja (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) { choco install ninja --no-progress -y }
          ninja --version

      - name: Install build tools and Qt runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build g++-13 \
            libgl1-mesa-dev libxkbcommon-dev libxkbcommon-x11-0 libegl1 libfontconfig1 \
            libdbus-1-3 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1

      - name: Install Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Install Qt ${{ env.QT_VERSION }}
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: ${{ matrix.qt-arch }}
          aqtversion: ${{ env.AQT_VERSION }}
          cache: true

      - name: Configure
        run: cmake --preset ci

      - name: Build
        run: cmake --build --preset ci

      # The application tests must be part of every run, on every OS.
      - name: Check that the application tests are registered
        shell: bash
        run: |
          count="$(ctest --preset ci -N -L pmm_app_tests | tr -d '\r' | sed -n 's/^Total Tests: *//p')"
          echo "pmm_app_tests: ${count:-0} tests"
          test "${count:-0}" -gt 0

      - name: Test
        run: ctest --preset ci --output-on-failure --output-junit ctest-junit.xml

      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-logs-${{ matrix.os }}
          path: |
            build/ci/Testing/Temporary/
            build/ci/ctest-junit.xml
          if-no-files-found: ignore
          retention-days: 14

  core-sanitize:
    name: Sanitizers (Linux GCC, Qt-free libraries)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CC: gcc-13
      CXX: g++-13
      ASAN_OPTIONS: detect_leaks=1
      UBSAN_OPTIONS: print_stacktrace=1
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build g++-13
          # ASan in GCC 13 cannot map its shadow memory with the runner
          # kernel's default ASLR entropy.
          sudo sysctl -w vm.mmap_rnd_bits=28

      - name: Configure
        run: cmake --preset core-sanitize

      - name: Build
        run: cmake --build --preset core-sanitize

      - name: Test
        run: ctest --preset core-sanitize --output-on-failure --output-junit ctest-junit.xml

      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-logs-core-sanitize
          path: |
            build/core-sanitize/Testing/Temporary/
            build/core-sanitize/ctest-junit.xml
          if-no-files-found: ignore
          retention-days: 14

  format-check:
    name: Format check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install clang-format ${{ env.CLANG_FORMAT_VERSION }}
        run: python -m pip install "clang-format==${CLANG_FORMAT_VERSION}"

      - name: Check formatting
        run: |
          clang-format --version
          # scripts/check-format.sh only warns about another major version.
          clang-format --version | grep 'version 22\.' > /dev/null || { echo "clang-format 22 expected" >&2; exit 1; }
          bash scripts/check-format.sh

      - name: Check UI colour contrast
        run: python ui/dev/check_contrast.py
